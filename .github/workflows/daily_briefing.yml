name: Daily Fleet Briefing

on:
  schedule:
    - cron: "0 7 * * 1-5"   # 07:00 UTC, Monday–Friday
  workflow_dispatch:          # manual trigger from GitHub UI

jobs:
  briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Create .env
        working-directory: backend
        run: |
          cat > .env <<EOF
          DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL=${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
          DATA_SOURCE=${{ vars.DATA_SOURCE || 'csv' }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
          EOF

      - name: Generate sample data (first run only)
        working-directory: backend
        run: |
          if [ ! -f data/fleet_data.csv ]; then
            python main.py --generate-data
          fi

      - name: Run briefing agent
        working-directory: backend
        run: python main.py

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: fleet-report-${{ github.run_id }}
          path: backend/output/
          retention-days: 30
